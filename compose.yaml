services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9501:9501"
    environment:
      APP_NAME: cards-api
      APP_ENV: dev
      SCAN_CACHEABLE: "false"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: cards
      DB_USERNAME: cards
      DB_PASSWORD: cards
      DB_QUERY_LOG: "true"
      CARD_REPOSITORY: ${CARD_REPOSITORY:-orm}
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_USER: cards
      AMQP_PASSWORD: cards
      AMQP_VHOST: /
      AMQP_CONSUMER_ENABLED: "false"
      VAULT_BASE_URL: http://vault:8080
      GATEWAY_BASE_URL: http://gateway:8080
      VAULT_TIMEOUT: "2"
      GATEWAY_TIMEOUT: "2"
      HTTP_RETRY_ATTEMPTS: "3"
      TRANSACTION_MAX_ATTEMPTS: "3"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9501) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: cards-worker
      APP_ENV: dev
      SCAN_CACHEABLE: "false"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: cards
      DB_USERNAME: cards
      DB_PASSWORD: cards
      DB_QUERY_LOG: "true"
      CARD_REPOSITORY: orm
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_USER: cards
      AMQP_PASSWORD: cards
      AMQP_VHOST: /
      AMQP_CONSUMER_ENABLED: "true"
      VAULT_BASE_URL: http://vault:8080
      GATEWAY_BASE_URL: http://gateway:8080
      VAULT_TIMEOUT: "2"
      GATEWAY_TIMEOUT: "2"
      HTTP_RETRY_ATTEMPTS: "3"
      TRANSACTION_MAX_ATTEMPTS: "3"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9501) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  vault:
    build:
      context: ./docker/mocks
    environment:
      ROLE: vault
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - vault_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains((string) @file_get_contents('http://127.0.0.1:8080/health'), 'ok') ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  gateway:
    build:
      context: ./docker/mocks
    environment:
      ROLE: gateway
      GATEWAY_LATENCY_MS: "0"
      GATEWAY_SLOW_MS: "4000"
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - gateway_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains((string) @file_get_contents('http://127.0.0.1:8080/health'), 'ok') ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mysql:
    image: mysql:8.0.40
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cards
      MYSQL_USER: cards
      MYSQL_PASSWORD: cards
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-testing-database.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13.7-management
    environment:
      RABBITMQ_DEFAULT_USER: cards
      RABBITMQ_DEFAULT_PASS: cards
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
  rabbitmq_data:
  vault_data:
  gateway_data:
